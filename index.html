<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 小小性格探索遊戲 (MBIT) 🌟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f9ff; }
        .quiz-card { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); border: 4px solid #3b82f6; }
        .option-button { transition: all 0.2s ease-in-out; }
        .option-button:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.5); }
        .active-dimension { background-color: #fcd34d; color: #1f2937; font-weight: bold; }
        .smbit-image { animation: pulse-grow 2s infinite ease-in-out; }
        @keyframes pulse-grow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body class="p-4 sm:p-8 flex items-center justify-center min-h-screen">

    <div id="app" class="w-full max-w-4xl quiz-card bg-white rounded-xl p-6 sm:p-10">
        <header class="text-center mb-6 sm:mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-blue-600 mb-2">🚀 小小性格探索隊 🚀</h1>
            <p class="text-lg text-gray-500">五年級專屬：沒有對錯，選出最像你的答案！</p>
            <div id="progressContainer" class="mt-4 hidden">
                <div class="h-3 w-full bg-gray-200 rounded-full">
                    <div id="progressBar" class="h-3 bg-green-500 rounded-full transition-all duration-500" style="width: 0%;"></div>
                </div>
                <p id="progressText" class="text-sm text-gray-500 mt-1"></p>
            </div>
        </header>

        <main id="mainContent" class="min-h-[400px] flex flex-col justify-center">
            <div id="loading" class="text-center text-blue-500 text-xl">載入中... 請稍候 ⏳</div>
            
            <div id="quizContainer" class="hidden">
                <p id="questionPrompt" class="text-xl sm:text-2xl font-semibold text-gray-800 mb-6 text-center leading-relaxed"></p>
                <div id="optionsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6"></div>
                <div class="mt-8 flex flex-wrap justify-center gap-2 text-sm sm:text-lg">
                    <span id="dimE" class="px-3 py-1 rounded-lg bg-gray-200">外向 (E)</span>
                    <span id="dimI" class="px-3 py-1 rounded-lg bg-gray-200">內向 (I)</span>
                    <span id="dimS" class="px-3 py-1 rounded-lg bg-gray-200">感覺 (S)</span>
                    <span id="dimN" class="px-3 py-1 rounded-lg bg-gray-200">直覺 (N)</span>
                    <span id="dimT" class="px-3 py-1 rounded-lg bg-gray-200">思考 (T)</span>
                    <span id="dimF" class="px-3 py-1 rounded-lg bg-gray-200">情感 (F)</span>
                    <span id="dimJ" class="px-3 py-1 rounded-lg bg-gray-200">計畫 (J)</span>
                    <span id="dimP" class="px-3 py-1 rounded-lg bg-gray-200">隨性 (P)</span>
                </div>
                <div class="mt-8 flex justify-center">
                    <button id="backButton" class="hidden px-6 py-2 text-lg font-semibold text-gray-600 border-2 border-gray-300 rounded-full hover:bg-gray-100 transition duration-150" onclick="goBack()">⬅️ 返回上題</button>
                </div>
            </div>

            <div id="resultContainer" class="hidden text-center">
                <h2 class="text-3xl sm:text-5xl font-extrabold text-pink-600 mb-4 animate-bounce">🎉 你的小小性格是！ 🎉</h2>
                <div id="smbitImageContainer" class="text-8xl mb-4 smbit-image"></div>
                <div id="finalType" class="text-7xl sm:text-9xl font-black text-blue-800 bg-yellow-200 p-6 rounded-2xl inline-block mb-8"></div>
                <div id="explanationContainer" class="text-left p-6 bg-gray-50 border-l-4 border-pink-500 rounded-lg"></div>
                <button id="restartButton" class="mt-8 px-8 py-3 text-xl font-bold text-white bg-red-500 rounded-xl shadow-lg hover:bg-red-600 transition duration-150" onclick="resetQuiz()">🔄 重新測驗</button>
                <p id="userIdDisplay" class="mt-4 text-xs text-gray-400"></p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase 配置 ---
        // 如果您有自己的 Firebase，請將內容填入下方的 MY_FIREBASE_CONFIG
        const MY_FIREBASE_CONFIG = null; 
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'mbit-child-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : MY_FIREBASE_CONFIG;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth, userId;
        let isFirebaseActive = false;
        let currentQuestionIndex = 0;
        const answers = {};
        const TOTAL_QUESTIONS = 20;

        const questions = [
            { id: 1, prompt: "下課時,你通常會:", dim: 'E/I', opt1: { text: "跟同學聊天、一起玩遊戲", key: "E" }, opt2: { text: "自己安靜看書或做自己的事", key: "I" } },
            { id: 2, prompt: "在班上回答問題時,你會:", dim: 'E/I', opt1: { text: "很快就舉手,想跟大家分享", key: "E" }, opt2: { text: "先在心裡想清楚,通常比較少舉手", key: "I" } },
            { id: 3, prompt: "假日的時候,你比較喜歡:", dim: 'E/I', opt1: { text: "和很多朋友一起出去玩", key: "E" }, opt2: { text: "在家裡自己做喜歡的事情", key: "I" } },
            { id: 4, prompt: "遇到新同學時,你會:", dim: 'E/I', opt1: { text: "主動去打招呼,馬上認識他", key: "E" }, opt2: { text: "先觀察一下,慢慢才和他熟", key: "I" } },
            { id: 5, prompt: "當老師要分組活動時,你會:", dim: 'E/I', opt1: { text: "很快就想要加入別人的小組", key: "E" }, opt2: { text: "會等別人來邀請,才慢慢加入", key: "I" } },
            { id: 6, prompt: "上課聽故事時,你最記得:", dim: 'S/N', opt1: { text: "故事裡的細節(例如人物穿什麼衣服、在哪裡)", key: "S" }, opt2: { text: "故事裡的想法或啟示(例如帶給我的感覺、想像)", key: "N" } },
            { id: 7, prompt: "寫作文時,你通常:", dim: 'S/N', opt1: { text: "會把事情一步一步寫得很清楚", key: "S" }, opt2: { text: "會加入很多自己的想像或創意", key: "N" } },
            { id: 8, prompt: "做美勞作品時,你比較:", dim: 'S/N', opt1: { text: "照著步驟一步步完成", key: "S" }, opt2: { text: "喜歡自己改一改,加上新點子", key: "N" } },
            { id: 9, prompt: "老師出題目時,你常常:", dim: 'S/N', opt1: { text: "先把問題看仔細,再慢慢回答", key: "S" }, opt2: { text: "先有一個想法,再用創意去想答案", key: "N" } },
            { id: 10, prompt: "你喜歡的遊戲類型是:", dim: 'S/N', opt1: { text: "規則清楚的遊戲(例如棋盤遊戲、拼圖)", key: "S" }, opt2: { text: "可以自由想像的遊戲(例如角色扮演、創意故事)", key: "N" } },
            { id: 11, prompt: "當同學和你意見不同時,你通常:", dim: 'T/F', opt1: { text: "想先找出誰的理由比較有道理", key: "T" }, opt2: { text: "想先顧及大家的感受,不想讓人難過", key: "F" } },
            { id: 12, prompt: "如果班上有比賽,你比較在意:", dim: 'T/F', opt1: { text: "要不要贏,輸贏對我很重要", key: "T" }, opt2: { text: "大家有沒有合作好,氣氛快不快樂", key: "F" } },
            { id: 13, prompt: "當朋友忘了帶鉛筆時,你會:", dim: 'T/F', opt1: { text: "想「下次要提醒他帶」", key: "T" }, opt2: { text: "馬上借給他,怕他沒鉛筆會不開心", key: "F" } },
            { id: 14, prompt: "遇到問題時,你會:", dim: 'T/F', opt1: { text: "先分析,想出最合適的方法", key: "T" }, opt2: { text: "先關心,有沒有誰需要幫忙", key: "F" } },
            { id: 15, prompt: "如果有人在遊戲中被排擠,你會:", dim: 'T/F', opt1: { text: "想「要怎麼解決這個情況比較公平?」", key: "T" }, opt2: { text: "想「我要怎麼做,讓他不再難過?」", key: "F" } },
            { id: 16, prompt: "寫功課時,你比較:", dim: 'J/P', opt1: { text: "喜歡先安排好時間,照計劃完成", key: "J" }, opt2: { text: "想到什麼先做什麼,常常靈機一動", key: "P" } },
            { id: 17, prompt: "出門旅行時,你會:", dim: 'J/P', opt1: { text: "喜歡先知道行程,安排清楚", key: "J" }, opt2: { text: "覺得不用太規劃,去玩就對了", key: "P" } },
            { id: 18, prompt: "遇到臨時改變(老師改作業或行程),你會:", dim: 'J/P', opt1: { text: "有點不習慣,想照原本的計劃走", key: "J" }, opt2: { text: "沒關係,很快就能接受新的安排", key: "P" } },
            { id: 19, prompt: "做大隊接力或比賽時,你通常:", dim: 'J/P', opt1: { text: "想先安排好誰跑哪一棒,才能不出錯", key: "J" }, opt2: { text: "覺得大家努力就好,不一定要照計劃", key: "P" } },
            { id: 20, prompt: "在寫報告或做專題時,你會:", dim: 'J/P', opt1: { text: "想先把流程、步驟列好再開始", key: "J" }, opt2: { text: "邊做邊想,讓想法自然跑出來", key: "P" } },
        ];

        const explanations = {
            E: { title: "外向 (E) - 就像太陽", desc: "喜歡和同學在一起，熱情分享能量。優點：容易交朋友、帶動氣氛。", color: "blue" },
            I: { title: "內向 (I) - 就像月亮", desc: "喜歡安靜思考，有豐富的小世界。優點：細心專注、處事冷靜。", color: "indigo" },
            S: { title: "感覺 (S) - 小偵探", desc: "注意細節，做事踏實精準。優點：可靠、觀察力強。", color: "green" },
            N: { title: "直覺 (N) - 小發明家", desc: "想像力豐富，充滿創意靈感。優點：有創意、能想到新可能。", color: "red" },
            T: { title: "思考 (T) - 小科學家", desc: "重視邏輯與公平，冷靜分析問題。優點：理智、判斷力佳。", color: "yellow" },
            F: { title: "情感 (F) - 小暖心", desc: "體貼他人感受，重視友誼氣氛。優點：有同理心、善於安慰。", color: "pink" },
            J: { title: "計劃 (J) - 小隊長", desc: "喜歡有條理的安排，準時有效率。優點：負責、做事穩健。", color: "purple" },
            P: { title: "隨性 (P) - 探險家", desc: "喜歡彈性與變化，隨機應變能力強。優點：適應力強、樂天。", color: "orange" }
        };

        const images = {
            'ESFJ': '💖', 'ISFJ': '🌟', 'ESTJ': '💼', 'ISTJ': '📚',
            'ENFJ': '🌈', 'INFJ': '🔮', 'ENFP': '💡', 'INFP': '🌸',
            'ESTP': '🏍️', 'ISTP': '🔧', 'ESFP': '🎈', 'ISFP': '🎨',
            'ENTJ': '👑', 'INTJ': '♟️', 'ENTP': '🚀', 'INTP': '🧠'
        };

        const getDocRef = (uid) => doc(db, 'artifacts', appId, 'users', uid, 'progress', 'data');

        async function init() {
            // 如果完全沒有 Firebase 配置，切換到本地模式
            if (!firebaseConfig) {
                console.log("No Firebase config found. Running in local-only mode.");
                isFirebaseActive = false;
                document.getElementById('userIdDisplay').textContent = "本地模式 (進度不會存檔)";
                startQuiz();
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isFirebaseActive = true;

                const initAuth = async () => {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                };
                await initAuth();

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        document.getElementById('userIdDisplay').textContent = `學員代號: ${userId}`;
                        loadProgress();
                    }
                });
            } catch (err) {
                console.warn("Firebase initialization failed:", err);
                isFirebaseActive = false;
                document.getElementById('userIdDisplay').textContent = "連接失敗 (本地模式運行)";
                startQuiz();
            }
        }

        async function loadProgress() {
            if (!isFirebaseActive || !userId) return;
            try {
                const docRef = getDocRef(userId);
                const snap = await getDoc(docRef);
                if (snap.exists()) {
                    const data = snap.data();
                    Object.assign(answers, data.answers || {});
                    currentQuestionIndex = data.index || 0;
                }
            } catch (e) { console.error("Load error:", e); }
            startQuiz();
        }

        async function saveProgress() {
            if (!isFirebaseActive || !userId) return;
            try {
                const docRef = getDocRef(userId);
                await setDoc(docRef, { answers, index: currentQuestionIndex, updatedAt: new Date() }, { merge: true });
            } catch (e) { console.error("Save error:", e); }
        }

        function startQuiz() {
            document.getElementById('loading').classList.add('hidden');
            if (currentQuestionIndex >= TOTAL_QUESTIONS) {
                showResult();
            } else {
                document.getElementById('quizContainer').classList.remove('hidden');
                document.getElementById('progressContainer').classList.remove('hidden');
                renderQuestion();
            }
        }

        function renderQuestion() {
            const q = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / TOTAL_QUESTIONS) * 100;
            
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `進度：${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;
            document.getElementById('questionPrompt').textContent = `Q${currentQuestionIndex + 1}. ${q.prompt}`;
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            
            [q.opt1, q.opt2].forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-button p-6 rounded-xl border-4 border-blue-400 bg-white text-left hover:bg-blue-50 focus:ring-4 focus:ring-blue-300 transition duration-150 h-full flex flex-col justify-center";
                btn.innerHTML = `<div class="text-3xl mb-3">${idx === 0 ? '✨' : '💡'}</div><p class="text-lg font-semibold text-gray-700">${opt.text}</p>`;
                btn.onclick = () => selectOption(opt.key);
                container.appendChild(btn);
            });

            const dims = q.dim.split('/');
            document.querySelectorAll('[id^="dim"]').forEach(el => el.classList.remove('active-dimension', 'bg-blue-100'));
            document.getElementById(`dim${dims[0]}`).classList.add('active-dimension');
            document.getElementById(`dim${dims[1]}`).classList.add('active-dimension');
            
            document.getElementById('backButton').classList.toggle('hidden', currentQuestionIndex === 0);
        }

        function selectOption(key) {
            answers[currentQuestionIndex + 1] = key;
            currentQuestionIndex++;
            saveProgress();
            if (currentQuestionIndex >= TOTAL_QUESTIONS) {
                showResult();
            } else {
                renderQuestion();
            }
        }

        window.goBack = () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        };

        window.resetQuiz = () => {
            currentQuestionIndex = 0;
            Object.keys(answers).forEach(k => delete answers[k]);
            saveProgress();
            document.getElementById('resultContainer').classList.add('hidden');
            startQuiz();
        };

        function showResult() {
            document.getElementById('quizContainer').classList.add('hidden');
            document.getElementById('progressContainer').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');

            const counts = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
            Object.values(answers).forEach(k => counts[k]++);

            const type = [
                counts.E >= counts.I ? 'E' : 'I',
                counts.S >= counts.N ? 'S' : 'N',
                counts.T >= counts.F ? 'T' : 'F',
                counts.J >= counts.P ? 'J' : 'P'
            ].join('');

            document.getElementById('finalType').textContent = type;
            document.getElementById('smbitImageContainer').textContent = images[type] || '✨';
            
            let html = `<p class="mb-4 text-xl font-bold text-gray-700">你的四個性格原動力：</p><div class="space-y-4">`;
            type.split('').forEach(char => {
                const info = explanations[char];
                html += `
                    <div class="p-4 rounded-xl bg-${info.color}-50 border-l-4 border-${info.color}-500">
                        <h4 class="text-xl font-bold text-${info.color}-700">${info.title}</h4>
                        <p class="text-gray-600">${info.desc}</p>
                    </div>`;
            });
            html += `</div>`;
            document.getElementById('explanationContainer').innerHTML = html;
        }

        init();
    </script>
</body>
</html>
